# Secrets and variables below are written into this repo by cib-tenants when
# the tenant is provisioned; nobody has to copy rc files around.
#
# Runs on this tenant's own runner (label cib-tenant): a VM in the tenant's
# builder project, registered only to this repo, created by cib-tenants.
# Keystone/RGW are on the lab network, so GitHub-hosted runners can't reach them.

name: deploy

# Least privilege for GITHUB_TOKEN; jobs widen it only where needed.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  # Expiring, role-limited application credential, rotated by cib-tenants.
  OS_AUTH_TYPE: v3applicationcredential
  OS_AUTH_URL: ${{ vars.OS_AUTH_URL }}
  OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.OS_APPLICATION_CREDENTIAL_ID }}
  OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.OS_APPLICATION_CREDENTIAL_SECRET }}
  OS_IDENTITY_API_VERSION: "3"
  OS_CACERT: ${{ vars.OS_CACERT_PATH }}
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
  TF_VAR_domain: ${{ vars.TENANT_DOMAIN }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_s3_endpoint: ${{ vars.S3_ENDPOINT }}
  # The AWS SDK's default request checksums aren't accepted by all RGW releases.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  TF_IN_AUTOMATION: "1"

jobs:
  infra:
    # Fork PRs never reach the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cib-tenant]
    environment: ${{ github.event_name == 'pull_request' && 'plan' || 'production' }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config='endpoints={s3="${{ vars.S3_ENDPOINT }}"}'
      - run: terraform plan -input=false -out=tfplan
      - if: github.event_name != 'pull_request'
        run: terraform apply -input=false tfplan

  platform:
    needs: infra
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, cib-tenant]
    environment: production
    defaults:
      run:
        working-directory: platform
    env:
      TF_VAR_harness_account_id: ${{ secrets.HARNESS_ACCOUNT_ID }}
      TF_VAR_harness_delegate_token: ${{ secrets.HARNESS_DELEGATE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config='endpoints={s3="${{ vars.S3_ENDPOINT }}"}'
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false tfplan
