# Default: nothing reaches anything in this namespace...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# ...except the ingress controller reaching Backstage,
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backstage-from-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: backstage
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingressNamespace }}
      ports:
        - port: 7007
---
# ...Backstage (and the database's own replicas) reaching Postgres, and the
# CloudNativePG operator reaching the instance status port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: backstage-database
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backstage
        - podSelector:
            matchLabels:
              cnpg.io/cluster: backstage-database
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.cnpgNamespace }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: backstage-database
      ports:
        - port: 8000
