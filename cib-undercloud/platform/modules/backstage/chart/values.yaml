image: docker.io/verranm/backstage:0.0.93
hostname: backstage.local
replicas: 1
githubSecretName: backstage-github-secrets
ingressClassName: traefik
ingressNamespace: traefik
cnpgNamespace: cnpg-system
tls:
  clusterIssuer: backstage-selfsigned-issuer
  createSelfSignedIssuer: true
database:
  instances: 1
  size: 10Gi
  storageClass: standard
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi
